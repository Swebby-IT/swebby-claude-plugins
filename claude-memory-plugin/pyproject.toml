[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-memory"
version = "0.3.6"
description = "Persistent memory plugin for Claude Code — file-based memory with Qdrant vector search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Vincenzo"},
]

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "qdrant-client>=1.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
claude-memory = "claude_memory.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_memory*"]
